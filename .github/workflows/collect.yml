name: collect

# 매일 한 번 수집해 v1/ 을 갱신한다 (PLAN-R1 R1-T3 · 2026-08-28 하루 1회 전환).
#
# 실행하는 것은 코드 저장소에서 말아 커밋한 번들 하나뿐이다(.github/collector/collector.mjs).
# 수집기 소스를 여기 두지 않는 이유는 D7이다 — 소스를 옮기면 @tidbit/feed-schema 가 따라와
# 익스텐션 쪽 스키마와 두 벌이 된다. 번들은 스키마를 안에 말아 넣으므로 정본이 한 곳에 남는다.

on:
  schedule:
    # 매일 19:00 UTC. **04:00 KST 를 노린 것이 아니라 06:00 KST 를 노린 것이다** — 예약 시각은
    # 도착 시각이 아니다. 하루 1회 전환 뒤 7 run 실측(2026-08-28~09-03, 예약 21:00 UTC)에서
    # 지연이 1h53m~5h56m(중앙값 ~1h54m)이었다. 21:00 예약은 08:00 KST 에 떨어져 있었다.
    # 지연은 우리가 못 줄이므로 예약을 상례 지연만큼 당긴다.
    #
    # 모니터 신선도 상한(26h)은 이 이동과 무관하다 — 피드 나이는 연속한 두 발행의 간격이라
    # `24h + (이번 지연 − 지난 지연)`이고, 예약을 옮겨도 그 변동은 그대로다(spec 10장).
    - cron: '0 19 * * *'
  workflow_dispatch:

# 앞 run 이 아직 커밋 중인데 다음 run 이 겹치면 push 가 서로를 밀어낸다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          # 기본 GITHUB_TOKEN 으로 push 하면 **다른 워크플로가 트리거되지 않는다**(GitHub 사양).
          # 이 저장소는 push 가 Pages 빌드를 깨우는 구조라, 기본 토큰으로 밀면 파일은 바뀌는데
          # 공개 URL 은 옛 데이터를 계속 서빙한다 — 정확히 "조용히 망가지는" 실패다.
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect and publish
        env:
          DATA_DIR: ${{ github.workspace }}
          # SRC2(GitHub Search) 용. 없으면 degraded 로 돌고 카테고리당 카드가 크게 준다.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          # 분류와 요약을 둘 다 켠다. **분류는 반드시 여기서 해야 한다** — 없으면 HN 카드가
          # isDevRelevant 판정을 못 받아 전멸하고(D22, 판정 실패=탈락) R3 분류도 죽어
          # 트렌딩 카드 절반이 카테고리 없이 탈락한다. 맥 워커(D23)는 이제 백로그 담당이다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 모델 ID 는 시크릿이 아니라 설정이다. 코드에 하드코딩하지 않는다는 규칙(spec 7 장)의
          # 취지가 여기 있다 — 수집기는 기본값을 갖지 않으므로 **이 줄이 없으면 요약·분류가
          # 통째로 건너뛰어진다**(2026-08-19 실측: 키만 넣고 이 줄이 없어 HN 카드가 또 전멸했다).
          # 세대가 갈린다: 2.0 라인은 2026-06-01 종료됐다. 현행 한도는 AI Studio 에서 본다.
          SUMMARY_MODEL: gemini-3.5-flash-lite
        run: node .github/collector/collector.mjs

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'tidbit-collector'
          git config user.email 'tidbit-collector@users.noreply.github.com'

          # 수집기 소유 파일만 스테이징한다. summaries.json 과 overrides.json 은 다른 주체가
          # 쓰므로, 여기서 add 하면 파일 소유자 분리가 깨지고 세 주체가 서로를 밀어내기 시작한다.
          git add v1/index.json v1/feed v1/metrics.jsonl

          if git diff --cached --quiet; then
            echo 'NO_CHANGE: 발행할 변경이 없다'
            exit 0
          fi

          git commit -m "chore(feed): collect $(date -u +%FT%TZ)"

          # 요약 워커가 같은 저장소에 커밋하므로 경합이 실제로 난다. rebase 후 1회 재시도한다.
          git push || { git pull --rebase && git push; }
