name: monitor

# 30분마다 **공개 URL로** 피드를 검사한다 (D16 · PLAN-R1 R1-T4).
#
# 수집 워크플로와 분리한 이유는 둘이다 — 수집기가 죽으면 수집기의 자가검사도 같이 죽고,
# CDN 경유 경로(캐시·CORS 헤더)는 수집기 안에서 볼 수 없다. 사용자가 겪는 경로를 그대로 탄다.
#
# 이 시스템은 조용히 망가진다: 부분 실패가 정상 경로라 깨져도 새 탭은 카드를 띄운다.
# 그 카드가 3일 전 것일 뿐이다. 그래서 감시 대상은 프로세스가 아니라 데이터다.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        # G6은 "모니터를 일부러 실패시켜 Issue가 실제로 오는지"를 요구한다(PLAN-R1).
        # 그때마다 워크플로를 편집하면 프로덕션 설정을 훈련용으로 고치게 되고, 되돌리는 것을
        # 잊으면 감시가 죽는다. 입력으로 두면 훈련이 반복 가능하고 기본값은 안 건드린다.
        description: '검사할 오리진. 비우면 실제 피드. 없는 URL을 넣으면 실패 훈련이 된다'
        required: false
        default: ''

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run synthetic monitor
        id: check
        env:
          FEED_BASE_URL: ${{ inputs.base_url || 'https://louis-lemon.github.io/tidbit-data' }}
        run: |
          set -o pipefail
          node .github/monitor/monitor.mjs | tee report.md

      - name: Open or update the alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='합성 모니터 실패'
          BODY="$(cat report.md 2>/dev/null || echo '리포트를 만들지 못했다 — 워크플로 로그를 봐라')"
          BODY="${BODY}"$'\n\n'"[워크플로 실행 로그](${RUN_URL})"

          # 30분마다 도는 워크플로라 새 Issue를 매번 열면 알림이 쓸모없어진다.
          # 열려 있는 것이 있으면 댓글만 단다.
          EXISTING=$(gh issue list --state open --label monitor --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create monitor --color B60205 --description '합성 모니터 알림' 2>/dev/null || true
            gh issue create --title "$TITLE" --label monitor --body "$BODY"
          fi

      - name: Notify webhook
        # webhook 시크릿이 없으면 조용히 건너뛴다 — Issue 생성만으로도 알림은 성립한다.
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$RUN_URL" '{content: ("Tidbit 합성 모니터 실패 — " + $u)}')"

      - name: Close the alert issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 복구를 사람이 손으로 닫게 두면 다음 장애 때 "이미 열려 있는 Issue"로 묻힌다.
          EXISTING=$(gh issue list --state open --label monitor --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body '복구됐다 — 이번 검사는 전 항목 통과.'
            gh issue close "$EXISTING"
          fi
